<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملاحظات العمل - مزامنة سحابية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --primary: #4a5fc1; --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: var(--bg); min-height: 100vh; padding: 20px; color: #333; }
  .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
  header { background: linear-gradient(135deg, #4a5fc1, #6a4c93); color: #fff; padding: 25px; text-align: center; position: relative; }
  header h1 { font-size: 28px; margin-bottom: 5px; }
  header p { opacity: 0.9; font-size: 14px; }
  .sync-badge { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; font-size: 12px; }
  .sync-badge.synced { background: #28a745; }
  .sync-badge.syncing { background: #ffc107; color: #333; }
  .sync-badge.error { background: #dc3545; }
  .toolbar { display: flex; gap: 10px; padding: 15px 25px; background: #f7f8fc; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #eee; }
  .toolbar input, .toolbar select, .toolbar button { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
  .toolbar input[type="text"] { flex: 1; min-width: 150px; }
  .toolbar button { background: #4a5fc1; color: #fff; cursor: pointer; border: none; transition: 0.2s; }
  .toolbar button:hover { background: #3a4fa1; }
  .add-form { padding: 20px 25px; background: #fafbff; border-bottom: 1px solid #eee; }
  .add-form textarea { width: 100%; min-height: 80px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; resize: vertical; font-size: 15px; outline: none; font-family: inherit; }
  .add-form textarea:focus { border-color: #4a5fc1; }
  .form-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .form-row select, .form-row input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  .btn-add { background: #28a745; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
  .btn-add:hover { background: #218838; }
  .notes-list { padding: 20px 25px; }
  .note { background: #fff; border-right: 5px solid #4a5fc1; border-radius: 10px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: 0.2s; border: 1px solid #eee; }
  .note:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.1); transform: translateY(-2px); }
  .note.urgent { border-right-color: #dc3545; }
  .note.done { border-right-color: #28a745; opacity: 0.75; }
  .note.overdue { border-right-color: #ff6b35; background: rgba(255,107,53,0.05); }
  .note-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
  .note-title { font-weight: bold; font-size: 16px; }
  .note-meta { font-size: 12px; color: #888; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: #fff; margin-right: 4px; }
  .badge.urgent { background: #dc3545; }
  .badge.normal { background: #4a5fc1; }
  .badge.done { background: #28a745; }
  .badge.overdue { background: #ff6b35; }
  .note-body { white-space: pre-wrap; line-height: 1.6; color: #444; margin: 10px 0; }
  .note-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
  .tag-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; font-size: 12px; color: #fff; font-weight: bold; }
  .note-due { font-size: 12px; color: #888; margin: 5px 0; }
  .note-due.overdue { color: #ff6b35; font-weight: bold; }
  .note-due.today { color: #ffc107; font-weight: bold; }
  .note-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .note-actions button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s; }
  .btn-edit { background: #ffc107; color: #333; }
  .btn-toggle { background: #17a2b8; color: #fff; }
  .btn-delete { background: #dc3545; color: #fff; }
  .note-actions button:hover { opacity: 0.85; }
  .empty { text-align: center; padding: 40px; color: #999; font-size: 16px; }
  .stats { display: flex; gap: 15px; padding: 15px 25px; background: #f7f8fc; border-top: 1px solid #eee; flex-wrap: wrap; font-size: 13px; color: #555; }
  .stats span { font-weight: bold; color: #4a5fc1; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #4a5fc1; color: #fff; padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); opacity: 0; transform: translateY(20px); transition: 0.3s; z-index: 1000; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .tags-input { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px solid #ddd; border-radius: 8px; background: #fff; min-height: 40px; align-items: center; flex: 1; min-width: 200px; }
  .tags-input input { border: none !important; outline: none; flex: 1; min-width: 100px; padding: 4px !important; background: transparent !important; }
  .tag-chip .remove { cursor: pointer; opacity: 0.8; font-weight: bold; }
  .hidden { display: none !important; }
  @media (max-width: 600px) { body { padding: 10px; } header h1 { font-size: 22px; } .toolbar, .add-form, .notes-list { padding: 15px; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📋 ملاحظات العمل</h1>
    <p>مزامنة تلقائية بين جميع أجهزتك</p>
    <div class="sync-badge" id="syncBadge">🔄 جاري الاتصال...</div>
  </header>

  <div class="toolbar" id="mainToolbar">
    <input type="text" id="search" placeholder="🔍 بحث...">
    <select id="filter">
      <option value="all">كل الملاحظات</option>
      <option value="urgent">عاجل فقط</option>
      <option value="normal">عادي فقط</option>
      <option value="done">مكتمل فقط</option>
      <option value="overdue">متأخرة ⚠️</option>
      <option value="today">اليوم 📅</option>
    </select>
    <select id="tagFilter"><option value="all">كل الوسوم</option></select>
    <button onclick="exportNotes()">📤 تصدير</button>
    <button onclick="document.getElementById('import').click()">📥 استيراد</button>
    <input type="file" id="import" accept=".json" style="display:none" onchange="importNotes(event)">
  </div>

  <div class="add-form" id="addForm">
    <textarea id="noteText" placeholder="اكتب ملاحظتك هنا..."></textarea>
    <div class="form-row">
      <input type="text" id="noteTitle" placeholder="عنوان الملاحظة" style="flex:1; min-width:200px;">
      <input type="date" id="noteDue" title="تاريخ الاستحقاق">
      <select id="notePriority">
        <option value="normal">عادي</option>
        <option value="urgent">عاجل 🔥</option>
      </select>
    </div>
    <div class="form-row">
      <div class="tags-input" id="tagsInput">
        <input type="text" id="tagInput" placeholder="أضف وسماً ثم Enter">
      </div>
      <button class="btn-add" onclick="addNote()">➕ إضافة</button>
    </div>
  </div>

  <div class="notes-list" id="notesList"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== إعدادات Supabase المدمجة ==========
const SUPABASE_URL = 'https://vjkxfuocyuwnobulhpl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqa2tmeHVvY3l1d25vYnVsaHBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTM5NzYsImV4cCI6MjEwNzAyOTk3Nn0.YyIHh9UpHW_fdn24pX-ekJP8jpMwdWMoVGFIYCin00g';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let notes = [];
let currentTags = [];
const TAG_COLORS = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#34495e'];

async function loadNotes() {
  updateSyncStatus('syncing', 'جاري التحميل...');
  try {
    const { data, error } = await supabase.from('notes').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    notes = data || [];
    updateSyncStatus('synced', '✓ متصل');
    render();
    updateTagFilter();
  } catch (err) {
    console.error(err);
    updateSyncStatus('error', '✗ خطأ');
    if (err.message.includes('relation') || err.message.includes('does not exist')) {
      showToast('⚠️ جدول notes غير موجود! راجع خطوات إنشاء الجدول في الأسفل.');
    } else {
      showToast('❌ فشل التحميل: ' + err.message);
    }
  }
}

async function addNote() {
  const text = document.getElementById('noteText').value.trim();
  const title = document.getElementById('noteTitle').value.trim();
  const priority = document.getElementById('notePriority').value;
  const due = document.getElementById('noteDue').value;
  
  if (!text) { showToast('⚠️ اكتب نص الملاحظة'); return; }
  
  const note = {
    title: title || 'بدون عنوان',
    text,
    priority,
    due: due || null,
    tags: currentTags.join(','),
    status: 'active',
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString()
  };
  
  updateSyncStatus('syncing', 'جاري الحفظ...');
  try {
    const { error } = await supabase.from('notes').insert([note]);
    if (error) throw error;
    showToast('✅ تمت الإضافة');
    document.getElementById('noteText').value = '';
    document.getElementById('noteTitle').value = '';
    document.getElementById('noteDue').value = '';
    document.getElementById('notePriority').value = 'normal';
    currentTags = [];
    renderTagsInput();
    await loadNotes();
  } catch (err) {
    console.error(err);
    showToast('❌ فشل الحفظ: ' + err.message);
    updateSyncStatus('error', '✗ خطأ');
  }
}

async function deleteNote(id) {
  if (confirm('حذف هذه الملاحظة؟')) {
    updateSyncStatus('syncing', 'جاري الحذف...');
    try {
      const { error } = await supabase.from('notes').delete().eq('id', id);
      if (error) throw error;
      showToast('🗑️ تم الحذف');
      await loadNotes();
    } catch (err) {
      console.error(err);
      showToast('❌ فشل الحذف');
    }
  }
}

async function toggleDone(id) {
  const note = notes.find(n => n.id === id);
  const newStatus = note.status === 'done' ? 'active' : 'done';
  updateSyncStatus('syncing', 'جاري التحديث...');
  try {
    await supabase.from('notes').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', id);
    await loadNotes();
  } catch (err) { console.error(err); showToast('❌ فشل التحديث'); }
}

async function editNote(id) {
  const n = notes.find(n => n.id === id);
  const newText = prompt('تعديل الملاحظة:', n.text);
  if (newText !== null && newText.trim()) {
    updateSyncStatus('syncing', 'جاري التعديل...');
    try {
      await supabase.from('notes').update({ text: newText.trim(), updated_at: new Date().toISOString() }).eq('id', id);
      showToast('✏️ تم التعديل');
      await loadNotes();
    } catch (err) { console.error(err); showToast('❌ فشل التعديل'); }
  }
}

async function editDue(id) {
  const n = notes.find(n => n.id === id);
  const newDue = prompt('تاريخ الاستحقاق (YYYY-MM-DD):', n.due || '');
  if (newDue !== null) {
    updateSyncStatus('syncing', 'جاري التحديث...');
    try {
      await supabase.from('notes').update({ due: newDue.trim() || null, updated_at: new Date().toISOString() }).eq('id', id);
      await loadNotes();
    } catch (err) { console.error(err); }
  }
}

function updateSyncStatus(status, text) {
  const badge = document.getElementById('syncBadge');
  badge.textContent = text;
  badge.className = 'sync-badge ' + status;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

document.getElementById('tagInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(',', '');
    if (val && !currentTags.includes(val)) { currentTags.push(val); renderTagsInput(); }
    e.target.value = '';
  }
});

function renderTagsInput() {
  const container = document.getElementById('tagsInput');
  const input = document.getElementById('tagInput');
  container.innerHTML = '';
  currentTags.forEach((tag, i) => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.style.background = TAG_COLORS[i % TAG_COLORS.length];
    chip.innerHTML = `${escapeHtml(tag)} <span class="remove" onclick="removeTag(${i})">×</span>`;
    container.appendChild(chip);
  });
  container.appendChild(input);
}

function removeTag(i) { currentTags.splice(i, 1); renderTagsInput(); }

function getAllTags() {
  const tags = new Set();
  notes.forEach(n => { if (n.tags) n.tags.split(',').forEach(t => { if (t) tags.add(t); }); });
  return [...tags];
}

function updateTagFilter() {
  const sel = document.getElementById('tagFilter');
  const current = sel.value;
  const tags = getAllTags();
  sel.innerHTML = '<option value="all">كل الوسوم</option>' + tags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  sel.value = current;
}

function getDueStatus(due) {
  if (!due) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const dueDate = new Date(due); dueDate.setHours(0,0,0,0);
  const diff = Math.floor((dueDate - today) / (1000*60*60*24));
  if (diff < 0) return 'overdue';
  if (diff === 0) return 'today';
  return 'future';
}

function formatDate(due) {
  if (!due) return '';
  return new Date(due).toLocaleDateString('ar-EG', {year:'numeric', month:'short', day:'numeric'});
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const filter = document.getElementById('filter').value;
  const tagFilter = document.getElementById('tagFilter').value;
  const list = document.getElementById('notesList');
  
  let filtered = notes.filter(n => {
    const matchSearch = n.text.toLowerCase().includes(search) || (n.title || '').toLowerCase().includes(search);
    const dueStatus = getDueStatus(n.due);
    let matchFilter = true;
    if (filter === 'done') matchFilter = n.status === 'done';
    else if (filter === 'urgent') matchFilter = n.priority === 'urgent' && n.status !== 'done';
    else if (filter === 'normal') matchFilter = n.priority === 'normal' && n.status !== 'done';
    else if (filter === 'overdue') matchFilter = dueStatus === 'overdue' && n.status !== 'done';
    else if (filter === 'today') matchFilter = dueStatus === 'today' && n.status !== 'done';
    const matchTag = tagFilter === 'all' || (n.tags || '').split(',').includes(tagFilter);
    return matchSearch && matchFilter && matchTag;
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">📭 لا توجد ملاحظات</div>';
  } else {
    list.innerHTML = filtered.map(n => {
      const dueStatus = getDueStatus(n.due);
      const tags = (n.tags || '').split(',').filter(t => t);
      const tagsHtml = tags.map((t, i) => `<span class="tag-chip" style="background:${TAG_COLORS[i % TAG_COLORS.length]}">${escapeHtml(t)}</span>`).join('');
      let dueHtml = '';
      if (n.due) {
        const label = dueStatus === 'overdue' ? '⚠️ متأخر' : dueStatus === 'today' ? '🔔 اليوم' : '📅';
        dueHtml = `<div class="note-due ${dueStatus}">${label} ${formatDate(n.due)} <button onclick="editDue('${n.id}')" style="background:none;border:none;cursor:pointer;font-size:11px;color:inherit">✏️</button></div>`;
      }
      return `
      <div class="note ${n.priority} ${n.status} ${dueStatus === 'overdue' && n.status !== 'done' ? 'overdue' : ''}">
        <div class="note-header">
          <div class="note-title">${escapeHtml(n.title || 'بدون عنوان')}</div>
          <div>
            <span class="badge ${n.priority}">${n.priority === 'urgent' ? '🔥 عاجل' : 'عادي'}</span>
            ${n.status === 'done' ? '<span class="badge done">✓ مكتمل</span>' : ''}
            ${dueStatus === 'overdue' && n.status !== 'done' ? '<span class="badge overdue">⚠️ متأخر</span>' : ''}
          </div>
        </div>
        <div class="note-body">${escapeHtml(n.text)}</div>
        ${tagsHtml ? `<div class="note-tags">${tagsHtml}</div>` : ''}
        ${dueHtml}
        <div class="note-header">
          <div class="note-meta">📅 ${new Date(n.created_at).toLocaleString('ar-EG')}</div>
          <div class="note-actions">
            <button class="btn-edit" onclick="editNote('${n.id}')">✏️ تعديل</button>
            <button class="btn-edit" onclick="editDue('${n.id}')">📅 تاريخ</button>
            <button class="btn-toggle" onclick="toggleDone('${n.id}')">${n.status === 'done' ? '↩️ إعادة' : '✓ تم'}</button>
            <button class="btn-delete" onclick="deleteNote('${n.id}')">🗑️ حذف</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  const total = notes.length;
  const done = notes.filter(n => n.status === 'done').length;
  const urgent = notes.filter(n => n.priority === 'urgent' && n.status !== 'done').length;
  const overdue = notes.filter(n => getDueStatus(n.due) === 'overdue' && n.status !== 'done').length;
  document.getElementById('stats').innerHTML = `📊 الإجمالي: <span>${total}</span> | ✅ مكتمل: <span>${done}</span> | 🔥 عاجل: <span>${urgent}</span> | ⚠️ متأخر: <span>${overdue}</span>`;
}

function escapeHtml(t) { return String(t || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function exportNotes() {
  const blob = new Blob([JSON.stringify(notes, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'work-notes-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  showToast('📤 تم التصدير');
}

function importNotes(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (confirm(`استيراد ${imported.length} ملاحظة؟`)) {
        updateSyncStatus('syncing', 'جاري الاستيراد...');
        for (const note of imported) {
          await supabase.from('notes').insert([{
            title: note.title || 'بدون عنوان', text: note.text, priority: note.priority || 'normal',
            due: note.due || null, tags: note.tags || '', status: note.status || 'active',
            created_at: new Date().toISOString(), updated_at: new Date().toISOString()
          }]);
        }
        await loadNotes();
        showToast('📥 تم الاستيراد');
      }
    } catch { showToast('❌ ملف غير صالح'); }
  };
  reader.readAsText(file);
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter').addEventListener('change', render);
document.getElementById('tagFilter').addEventListener('change', render);
document.getElementById('noteText').addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') addNote(); });

renderTagsInput();
loadNotes();
setInterval(() => loadNotes(), 30000); // تحديث تلقائي كل 30 ثانية
</script>
</body>
</html>
